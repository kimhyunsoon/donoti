name: deploy

on:
  push:
    branches: [main]

# 서버 웹훅을 부르기 전에 backend·frontend 를 병렬로 검증한다 - 하나라도 실패하면 배포 자체가 시작되지 않음
# 어떤 서비스를 다시 빌드할지는 서버의 deploy/deploy.sh 가 변경 파일로 정한다
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 툴체인 (backend/rust-toolchain.toml)
        working-directory: backend
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: backend 검사 (fmt, clippy, test)
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: frontend 빌드 검증
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 서버 웹훅 호출
        run: |
          curl -fsS -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Key: $DEPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"targets\":\"deploy\",\"sha\":\"${{ github.sha }}\"}"
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
