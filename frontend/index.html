<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 앱형 UX: 더블탭·핀치 줌 비활성 (버튼 연타 시 확대 방지) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 노치·다이나믹 아일랜드 영역까지 앱 배경이 채워지도록 투명 상태바 사용 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="두노티">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48">
  <title>두노티</title>
  <style>
    /* 테마 토큰 — data-theme(자동/라이트/다크)이 미디어쿼리보다 우선 */
    /* 토스 스타일: 중립 그레이 배경 + 흰 카드(무테두리) + 브랜드 코랄 액센트 */
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-weak: #f7f8fa;
      --text: #191f28;
      --text-sub: #8b95a1;
      --accent: #e64c45;
      --accent-soft: #fdeae8;
      --border: #eceef0;
      --danger: #e5484d;
      --warn: #d68910;
      --ok: #1fa76b;
      --switch-on: #34c759; /* iOS 스타일 토글 녹색 */
      --day-on: #3182f6;    /* 요일 선택 (토스 블루) */
    }
    :root[data-theme='light'] { color-scheme: light; }
    :root[data-theme='dark'] {
      color-scheme: dark;
      --bg: #17171c;
      --surface: #202027;
      --surface-weak: #26262e;
      --text: #e9ebee;
      --text-sub: #8b95a1;
      --accent: #f0736d;
      --accent-soft: #3a2523;
      --border: #2c2c35;
      --danger: #ff6b6b;
      --warn: #e0a060;
      --ok: #3fce8b;
      --switch-on: #30d158;
      --day-on: #4593fc;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        color-scheme: dark;
        --bg: #17171c;
        --surface: #202027;
        --surface-weak: #26262e;
        --text: #e9ebee;
        --text-sub: #8b95a1;
        --accent: #f0736d;
        --accent-soft: #3a2523;
        --border: #2c2c35;
        --danger: #ff6b6b;
        --warn: #e0a060;
        --ok: #3fce8b;
        --switch-on: #30d158;
        --day-on: #4593fc;
      }
    }
    html { font-size: 15px; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
      /* 브라우저 자체 당겨서-새로고침과 앱 내 새로고침의 중복 방지 */
      overscroll-behavior-y: contain;
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
