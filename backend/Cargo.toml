[package]
name = "donoti-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
matchit = "0.9.2"
tokio = { version = "1.54.1", features = ["full"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
ryu = "1.0.23"
indexmap = "2.14.2"
argon2 = "0.6.0"
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
subtle = "2.6.1"
rand = "0.10.4"
hex = "0.4.3"
percent-encoding = "2.3.2"
chrono = "0.4.45"
chrono-tz = "0.10.4"
regex = "1.13.1"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.11.1"
hkdf = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart"] }
url = "2.5.8"
fancy-regex = "0.20.2"

[profile.release]
strip = true

# 로컬 개발: 의존성(argon2 등)만 최적화해 로그인이 느리지 않게
[profile.dev.package."*"]
opt-level = 2
